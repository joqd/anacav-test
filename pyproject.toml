[project]
name = "test-porject-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.17",
    "django-unfold>=0.81.0",
    "psycopg2>=2.9.13",
]


[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
exclude = [
	"**/migrations/**",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.ruff.format]
quote-style = "single"
